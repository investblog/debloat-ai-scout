name: Competitor Watch

on:
  schedule:
    # Weekly on Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write # commit updated snapshots
  issues: write # open the weekly report issue

concurrency:
  group: competitor-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Watch competitors
        run: npm run watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit snapshots
        run: |
          # GitHub disables scheduled workflows after 60 days without repo activity
          # (that silently killed the old scan). Touch a heartbeat file every ~45 days.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +%FT%TZ > snapshots/.heartbeat
          fi
          git add snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(snapshots): competitor watch $(date -u +%F)"
          git push
