name = "debloat-ai-scout"
main = "worker/src/index.ts"
compatibility_date = "2026-03-06"
workers_dev = true

routes = [
  { pattern = "scout.debloat.click/*", zone_name = "debloat.click" }
]

# KV namespace
[[kv_namespaces]]
binding = "STATE"
id = "de0c1b698042405092af81a2196ca9ae"

# R2 bucket
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "debloat-scout-artifacts"

[alias]
"@" = "src"
"@configs" = "configs"

[vars]
GITHUB_REPO_OWNER = "investblog"
GITHUB_REPO_NAME = "debloat"
